name: Read CS2 schema metadata
description: >
  Reads the CS2 build identity and dump date out of the upstream cs2_schema.json
  and exposes them as outputs (`revision`, `date-iso`). Used by the CI
  workflows that pack the SDK so the resulting NuGet package carries SemVer 2
  build metadata identifying which CS2 build it was generated from.

  Reads both upstream header shapes. Schema 1.x carries `revision` as a numeric
  mirror id; schema 2.0 replaced it with `build_id` (the Steam CS2 game build)
  and repurposed `revision` as a walker-identity string. `build_id` wins where
  both are present.

  Both outputs are validated against the SemVer 2 build-metadata identifier
  grammar ([0-9A-Za-z-]+, no spaces) before they are emitted, because that is
  where they end up: `+cs.{revision}.dump.{date-iso}` on the package version.

outputs:
  revision:
    description: >
      Numeric CS2 build identity (e.g. "24537688"). Sourced from the header's
      `build_id` on schema 2.0, or its numeric `revision` on schema 1.x.
    value: ${{ steps.parse.outputs.revision }}
  date-iso:
    description: Schema dump date as ISO yyyy-MM-dd (e.g. "2026-08-03").
    value: ${{ steps.parse.outputs.date-iso }}

runs:
  using: composite
  steps:
    - name: Parse cs2_schema.json header
      id: parse
      shell: bash
      run: |
        set -euo pipefail
        SCHEMA_PATH="upstream/docs/generated/downstream-codegen-schemas/cs2_schema.json"
        if [ ! -f "$SCHEMA_PATH" ]; then
          echo "::error::Expected $SCHEMA_PATH (is the submodule initialised?)"
          exit 1
        fi

        # The first ~300 bytes carry the header keys; full-file jq would parse
        # 11MB needlessly. head -c keeps memory bounded but produces invalid JSON,
        # so fall back to jq if the head heuristic ever fails.
        HEADER=$(head -c 512 "$SCHEMA_PATH")

        # Two header shapes, and the difference matters because on 2.0 the key
        # named `revision` holds something that must never reach a package
        # version:
        #
        #   1.1  "revision": 10677034
        #   2.0  "build_id": 24537688,
        #        "revision": "hl2sdk-cs2/5f891c90…/v1/3d1200e3…"
        #
        # So take `build_id` first and only fall back to `revision`, rather than
        # reading `revision` and hoping. Both patterns want digits, which keeps
        # the 2.0 walker identity from matching either.
        BUILD=$(printf '%s' "$HEADER" | sed -nE 's/.*"build_id":[[:space:]]*([0-9]+).*/\1/p' | head -1)
        if [ -z "$BUILD" ]; then
          BUILD=$(printf '%s' "$HEADER" | sed -nE 's/.*"revision":[[:space:]]*([0-9]+).*/\1/p' | head -1)
        fi
        DATE=$(printf '%s' "$HEADER" | sed -nE 's/.*"version_date":[[:space:]]*"([^"]+)".*/\1/p' | head -1)

        if [ -z "$BUILD" ] || [ -z "$DATE" ]; then
          # Fallback: full jq parse if the head heuristic missed the keys.
          # `// empty` rather than jq's default null-to-string, so a missing key
          # stays empty and trips the check below instead of emitting "null".
          BUILD=$(jq -r '.build_id // .revision // empty' "$SCHEMA_PATH")
          DATE=$(jq -r '.version_date // empty' "$SCHEMA_PATH")
        fi

        # Fail closed. The predecessor to this check did not exist, and the
        # consequence was not a failed run but a silent wrong one: on a 2.0
        # header the sed above missed, the jq fallback read the walker identity,
        # nothing was empty, and the action exited 0 having produced
        # `+cs.hl2sdk-cs2/5f891c90…` — slashes and all — as a SemVer 2 build
        # metadata identifier. Anything non-numeric here is a header shape we
        # have not been taught to read, and guessing is worse than stopping.
        if ! printf '%s' "$BUILD" | grep -qE '^[0-9]+$'; then
          echo "::error::No numeric build identity in $SCHEMA_PATH header." \
               "Read '$BUILD' from build_id/revision. Schema 2.0 headers must" \
               "carry build_id; see docs/upstream/schematracker-migration.md."
          exit 1
        fi

        # Normalise to ISO so the value is valid as a SemVer 2 build-metadata
        # identifier (no spaces). Upstream has produced exactly two shapes:
        # "May 21 2026" on schema 1.x and "2026-08-03" on 2.0.
        #
        # Both are matched here before `date` is involved, and anything else is
        # rejected without asking it, because `date` is the wrong thing to lean
        # on for validation twice over:
        #
        #   * GNU date reads the empty string as "now" and prints today, so a
        #     header missing version_date produced a well-formed ISO date that
        #     passed every check and stamped the date of the CI run into the
        #     package version. BSD date rejects it, so this reproduced only on
        #     the runner — it was caught by test.sh's first CI run, not locally.
        #   * GNU date also accepts relative expressions ("last tuesday"), so a
        #     junk value can parse to a real date rather than failing.
        #
        # `date` now only ever sees a string already known to be "%b %d %Y",
        # which is the one case that genuinely needs converting. The ISO case is
        # a passthrough, which also keeps it working where `date -d` does not
        # exist — that flag is GNU-only and `-jf` is BSD-only.
        if printf '%s' "$DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          DATE_ISO="$DATE"
        elif printf '%s' "$DATE" | grep -qE '^[A-Z][a-z]{2} [0-9]{1,2} [0-9]{4}$'; then
          DATE_ISO=$(date -d "$DATE" +%Y-%m-%d 2>/dev/null \
                  || date -jf '%b %d %Y' "$DATE" +%Y-%m-%d 2>/dev/null \
                  || echo "")
        else
          echo "::error::Unrecognised version_date '$DATE' in $SCHEMA_PATH." \
               "Expected ISO yyyy-MM-dd (schema 2.0) or 'Mon DD YYYY' (1.x)."
          exit 1
        fi
        if ! printf '%s' "$DATE_ISO" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "::error::Could not parse schema date '$DATE' into ISO format" \
               "(got '$DATE_ISO')"
          exit 1
        fi

        echo "revision=$BUILD" >> "$GITHUB_OUTPUT"
        echo "date-iso=$DATE_ISO" >> "$GITHUB_OUTPUT"
        echo "CS2 build:  $BUILD"
        echo "Dump date:  $DATE_ISO"
