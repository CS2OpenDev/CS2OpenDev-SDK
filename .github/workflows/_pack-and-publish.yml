name: Pack and publish

# Reusable workflow that packs every shipped package and publishes it to
# NuGet.org. Invoked via `workflow_call` from both check-upstream.yml (scheduled
# bot refresh) and release.yml (manual or version.json-driven release). Keeping
# the pack+publish logic in one place avoids the chained-workflow gotcha where
# the default GITHUB_TOKEN can't trigger downstream workflow_runs.
#
# Four packages ship, and they do NOT share a version. Three clocks:
#
#   * CS2OpenDev.Sdk and CS2OpenDev.Sdk.GameEvents move on the schema clock.
#   * CS2OpenDev.Protos moves on the protobuf clock — its version.json matches
#     `protos/` only, so a regen that leaves the descriptors alone does not
#     bump it.
#   * CS2OpenDev.Sdk.Entities.Abstractions moves only when a human edits it.
#     Its pathFilters cover its own directory and nothing else, deliberately:
#     it is a frozen contract other people's runtimes implement, and a contract
#     that regenerates every four hours is not frozen. It does not share the
#     family major either — see its version.json.
#
# So each package resolves its own version, gets its own release tag, and is
# skipped independently when its version is a prerelease.

on:
  workflow_call:
    inputs:
      ref:
        description: Ref/SHA to build (defaults to the caller's ref).
        type: string
        required: false
        default: ''
    secrets:
      NUGET_API_KEY:
        description: NuGet.org publish key. When omitted the package is still built and uploaded as a workflow artifact so forks can download it.
        required: false

permissions:
  contents: write
  # Required to push to the GitHub Packages NuGet feed. Must also be declared
  # by every caller (release.yml, check-upstream.yml): a reusable workflow can
  # only hold or reduce the caller's GITHUB_TOKEN permissions, never elevate
  # them, so a caller that omits this makes the push fail with a 403.
  packages: write

jobs:
  publish:
    name: Pack and publish ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      # Strictly sequential, in dependency order: CS2OpenDev.Sdk.GameEvents
      # declares dependencies on the other two, so publishing it first would put
      # a package on the feed whose dependencies aren't resolvable yet. NuGet
      # does not validate that at push time — the push succeeds and a consumer
      # restoring in the gap gets the failure instead.
      max-parallel: 1
      # One package failing must not cancel the others mid-publish. A partial
      # release is recoverable (`--skip-duplicate` makes a re-run safe); a
      # cancelled one leaves less signal about what actually happened.
      fail-fast: false
      matrix:
        include:
          - id: CS2OpenDev.Protos
            path: src/CS2OpenDev.Protos
            # Stamps its provenance from the committed protos/PROVENANCE.json,
            # so it needs no CS2Schema* properties passed in.
            schema_metadata: false
          - id: CS2OpenDev.Sdk
            path: src/CS2OpenDev.Sdk
            schema_metadata: true
          - id: CS2OpenDev.Sdk.GameEvents
            path: src/CS2OpenDev.Sdk.GameEvents
            schema_metadata: true
          - id: CS2OpenDev.Sdk.Entities.Abstractions
            path: src/CS2OpenDev.Sdk.Entities.Abstractions
            # No schema provenance, and not for CS2OpenDev.Protos' reason. That
            # package omits it because it stamps its own from PROVENANCE.json;
            # this one omits it because the facts do not apply. Nothing here is
            # generated from a CS2 build, so "which schema revision is this"
            # has no answer — stamping one would imply the contract moves with
            # the schema, which is the exact coupling its isolated pathFilters
            # exist to prevent.
            schema_metadata: false
    env:
      # Job-level so `if: env.NUGET_API_KEY != ''` can read it in step
      # conditions (step-level env is evaluated AFTER step `if:`).
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          # Full history so Nerdbank.GitVersioning can compute git-height.
          fetch-depth: 0

      - name: Capture checked-out SHA
        # `github.sha` reflects the caller's trigger SHA, not necessarily the
        # ref we actually checked out (when invoked from check-upstream.yml,
        # the caller passes a freshly-pushed bot commit via `inputs.ref`).
        # Capture HEAD now so the GitHub Release tags the right commit.
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a schema the SDK cannot attribute
        # Gated here rather than in the callers because both of them reach
        # publication through this workflow, and only one of them was covered.
        # check-upstream runs the same check before its regen, but release.yml
        # has no such step: a merge to main touching src/CS2OpenDev.Sdk/ or
        # version.json publishes whatever is committed. Without this, "hold the
        # release until upstream ships enum projectName" is enforced by nobody
        # merging the branch — a property of memory rather than of the repo.
        #
        # Only the schema-derived packages. CS2OpenDev.Protos is built from
        # protos/ on its own clock and is unaffected by the enum gap.
        if: matrix.schema_metadata
        run: python3 scripts/check-migration-readiness.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build (Release)
        run: dotnet build ${{ matrix.path }} --configuration Release -nologo

      - name: Read CS2 schema metadata
        id: schema
        if: matrix.schema_metadata
        uses: ./.github/actions/read-schema-metadata

      - name: Pack
        run: |
          if [ "${{ matrix.schema_metadata }}" = "true" ]; then
            dotnet pack ${{ matrix.path }} \
              --configuration Release \
              -nologo \
              -p:CS2SchemaRevision=${{ steps.schema.outputs.revision }} \
              -p:CS2SchemaDate=${{ steps.schema.outputs.date-iso }}
          else
            dotnet pack ${{ matrix.path }} --configuration Release -nologo
          fi

      - name: Resolve produced packages
        id: pkg
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          # The pack step produces both `.nupkg` (assemblies) and `.snupkg`
          # (symbols / portable PDBs) thanks to `IncludeSymbols=true` +
          # `SymbolPackageFormat=snupkg`. Resolve the `.nupkg` first — its
          # filename carries the version — then derive the matching `.snupkg`.
          #
          # The `[0-9]` after the id is load-bearing, not decoration. A plain
          # `CS2OpenDev.Sdk.*.nupkg` also matches
          # `CS2OpenDev.Sdk.GameEvents.1.0.5.nupkg`, because the sibling
          # package's id is a prefix-extension of this one. Anchoring on the
          # version's first digit keeps each package resolving only its own
          # artifact.
          PKG=$(find artifacts/package -name "${ID}.[0-9]*.nupkg" -not -name '*.snupkg' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::No ${ID} .nupkg produced under artifacts/package/"
            exit 1
          fi
          SYM="${PKG%.nupkg}.snupkg"
          if [ ! -f "$SYM" ]; then
            echo "::warning::Symbols package missing at $SYM — proceeding without symbols"
            SYM=""
          fi

          # Strip the package id prefix with parameter expansion rather than a
          # regex — the id contains dots, and each package needs its own
          # pattern otherwise.
          BASE=$(basename "$PKG" .nupkg)
          VERSION="${BASE#"${ID}".}"
          PKG_DIR=$(dirname "$PKG")

          # Only stable versions get published. A SemVer prerelease label
          # (`1.0.4-g4a3672a4ae`) means this build did not come from a public
          # release ref: Nerdbank.GitVersioning appends `-g<commit>` whenever
          # the ref doesn't match `publicReleaseRefSpec` in version.json
          # (currently `^refs/heads/main$`).
          #
          # In practice this guards the paths that can build off an arbitrary
          # ref — `workflow_dispatch` from a branch, or a `ref` input passed to
          # this reusable workflow — rather than the normal main-branch push,
          # which always yields a clean version.
          #
          # Build metadata is stripped before the test. It cannot appear in a
          # .nupkg filename today, but it legitimately contains hyphens (the
          # ISO dump date, `+cs.10677034.dump.2026-05-21`), so testing the raw
          # string would misread a stable build as a prerelease if that ever
          # changed.
          if case "${VERSION%%+*}" in *-*) true ;; *) false ;; esac; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "path=$PKG"
            echo "symbols=$SYM"
            echo "dir=$PKG_DIR"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Packed: $PKG ($VERSION), prerelease=$PRERELEASE"
          if [ -n "$SYM" ]; then echo "Symbols: $SYM"; fi

      - name: Assert no build-machine paths in packages
        # Guards the leak fixed in v1.0.3: v1.0.2 shipped the packer's home
        # directory in the assembly's CodeView record and in the `.snupkg`
        # PDB's SourceLink map. `ContinuousIntegrationBuild=true` in each
        # shipped csproj rewrites those to `/_/`; this step fails the release if
        # a build ever stops honouring it (e.g. the property gets dropped, or a
        # future runner layout defeats the path mapping).
        #
        # Asserts the positive signal too — a `/_/` path must be PRESENT, not
        # merely a home path absent. Absence alone is equally what you get from
        # scanning the wrong file or a stale artifact.
        #
        # No third-party allowlist needed: every package contains only
        # first-party output (the assembly, its XML docs, README, and NuGet
        # metadata). Microsoft's and other vendors' binaries legitimately carry
        # their own CI agents' paths, but none are bundled here.
        env:
          PKG: ${{ steps.pkg.outputs.path }}
          SYM: ${{ steps.pkg.outputs.symbols }}
          PROJECT: ${{ matrix.path }}
        run: |
          set -euo pipefail
          python3 - "$PROJECT" "$PKG" ${SYM:+"$SYM"} <<'PY'
          import sys, zipfile

          LEAKS = (b'/Users/', b'/home/', b'/root/', b'C:\\Users\\')
          project, paths = sys.argv[1], sys.argv[2:]
          rc = 0

          for path in paths:
              print(f'=== {path} ===')
              leaked, normalised = {}, 0
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      data = z.read(name)
                      found = {n.decode('latin1'): data.count(n)
                               for n in LEAKS if data.count(n)}
                      normalised += data.count(b'/_/')
                      if found:
                          leaked[name] = found
                          for n in LEAKS:
                              i = data.find(n)
                              if i >= 0:
                                  print(f'  {name}: {data[i:i + 110]!r}')
              if leaked:
                  print(f'::error::Build-machine path in {path}: '
                        f'{", ".join(leaked)}. Check that '
                        f'ContinuousIntegrationBuild=true is still set in {project}.')
                  rc = 1
              elif not normalised:
                  print(f'::error::No build-machine path in {path}, but no '
                        'normalised `/_/` path either — the build did not '
                        'pick up ContinuousIntegrationBuild, or this is a '
                        'stale artifact. Treating as unverified.')
                  rc = 1
              else:
                  print(f'  clean ({normalised} normalised `/_/` occurrence(s))')

          sys.exit(rc)
          PY

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.id }}-${{ steps.pkg.outputs.version }}
          # Named explicitly rather than globbed: a `${id}.*.*nupkg` pattern
          # would sweep in the sibling package whose id extends this one.
          path: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.symbols }}
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != '' && steps.pkg.outputs.prerelease == 'false'
        # The `.nupkg` and `.snupkg` are pushed as two explicit calls rather
        # than one wildcard. A glob does not literally match `.snupkg`, and
        # relying on the client auto-pairing the adjacent symbols package is
        # behaviour NuGet/Home#9867 reports as unreliable when a wildcard is
        # involved. Naming both files explicitly removes the guesswork:
        # `--no-symbols` suppresses the implicit pairing, then the `.snupkg` is
        # pushed on its own to NuGet.org's symbol server.
        run: |
          dotnet nuget push "${{ steps.pkg.outputs.path }}" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --skip-duplicate

          if [ -n "${{ steps.pkg.outputs.symbols }}" ]; then
            dotnet nuget push "${{ steps.pkg.outputs.symbols }}" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          else
            echo "::warning::No .snupkg produced — symbols were not published."
          fi

      - name: Publish to GitHub Packages
        # Needs no repository secret — GITHUB_TOKEN is always present — so this
        # feed keeps a consumable package flowing while NUGET_API_KEY is unset.
        # Gated only on the version being stable.
        if: steps.pkg.outputs.prerelease == 'false'
        #
        # Deliberately ordered AFTER the NuGet.org push. NuGet.org is the
        # canonical feed and its publishes are irreversible (a version can be
        # unlisted but never replaced), so it must not be gated on a secondary
        # feed's availability. If this step fails, the canonical publish has
        # already succeeded and only the mirror needs retrying.
        #
        # The coupling is not symmetric, and the `if:` below does not remove
        # it: a step's condition still implies success() unless stated
        # otherwise, so a FAILED NuGet.org push skips this mirror as well.
        # That is the accepted trade — the canonical feed is the one whose
        # failure should stop a release — but it does mean a NuGet.org outage
        # blocks GitHub Packages, and the fix in that case is to re-run the
        # job once NuGet.org recovers (`--skip-duplicate` makes that safe).
        #
        # Two GitHub Packages constraints shape this step:
        #
        #   1. It does NOT support symbol packages. Pushing a `.snupkg` (or
        #      letting the client auto-pair the adjacent one) is rejected as a
        #      version conflict, which would fail the job. `--no-symbols` stops
        #      the client from ever offering it, so symbols go to NuGet.org's
        #      symbol server only.
        #   2. Auth is the token, passed as the API key. `packages: write` is
        #      declared here AND in both callers (release.yml,
        #      check-upstream.yml) — a called workflow can only hold or reduce
        #      the caller's permissions, never elevate, so a caller that omits
        #      it yields a 403 here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "${{ steps.pkg.outputs.path }}" \
            --api-key "$GITHUB_TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --no-symbols \
            --skip-duplicate

      - name: Notice when publishing is skipped for a prerelease
        # Prerelease builds are packed, gated and uploaded as a workflow
        # artifact, but never published to a feed. Say so explicitly — a run
        # that is green and published nothing is otherwise indistinguishable
        # from one that published successfully.
        if: steps.pkg.outputs.prerelease == 'true'
        run: |
          echo "::warning::${{ matrix.id }} ${{ steps.pkg.outputs.version }} is a prerelease version — NOTHING was published, to NuGet.org or GitHub Packages. Only stable versions (e.g. 1.0.4, not 1.0.4-g0123456789) are published. Nerdbank.GitVersioning appends the -g<commit> label when the built ref does not match publicReleaseRefSpec in version.json (currently ^refs/heads/main\$). Download the package from this run's Artifacts section if you need it."

      - name: Notice when NuGet.org publish is skipped
        # Loud notice that a STABLE package reached GitHub Packages but not
        # NuGet.org. Catches misconfigured secrets (e.g. `NUGET_TOKEN` vs
        # `NUGET_API_KEY`) that would otherwise silently fail for weeks.
        #
        # Conditioned on non-prerelease as well as the missing key, and ordered
        # AFTER the GitHub Packages push: the message asserts in the past tense
        # that the package reached GitHub Packages, so it must not fire when
        # that push was skipped (prerelease) or has not yet run. The prerelease
        # case is covered by the separate notice above.
        if: env.NUGET_API_KEY == '' && steps.pkg.outputs.prerelease == 'false'
        run: |
          echo "::warning::NUGET_API_KEY secret is not set on this repository — ${{ matrix.id }} ${{ steps.pkg.outputs.version }} was published to GitHub Packages, but NOT to NuGet.org, and its symbols were not published to any symbol server. To enable NuGet.org publishing, add the secret in Settings → Secrets and variables → Actions."

      - name: Create GitHub Release
        # Gated on a stable version only — a prerelease build would otherwise
        # tag something that was never published.
        #
        # Deliberately NOT gated on NUGET_API_KEY. Every version that reaches a
        # feed gets a matching tag and release, and GitHub Packages publishes
        # without any secret, so tying the tag to the NuGet.org key would leave
        # published versions with no corresponding tag in the repo.
        #
        # Tags are namespaced per package (`CS2OpenDev.Protos/v1.0.7`) because
        # the three packages no longer share a version: CS2OpenDev.Protos moves
        # on the protobuf clock and the others on the schema clock, so a bare
        # `v1.0.7` would be ambiguous the first time those diverge. Releases
        # tagged `v*` before this change belong to CS2OpenDev.Sdk.
        if: steps.pkg.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_ID: ${{ matrix.id }}
          PKG_PATH: ${{ steps.pkg.outputs.path }}
          PKG_SYMBOLS: ${{ steps.pkg.outputs.symbols }}
          TAG: ${{ matrix.id }}/v${{ steps.pkg.outputs.version }}
          TARGET_SHA: ${{ steps.head.outputs.sha }}
          REVISION: ${{ steps.schema.outputs.revision }}
          DUMP_DATE: ${{ steps.schema.outputs.date-iso }}
        run: |
          set -euo pipefail

          # Record which feeds actually received this version, so the release
          # page can't imply a NuGet.org publish that never happened.
          if [ -n "${NUGET_API_KEY:-}" ]; then
            FEEDS='Published to NuGet.org (with symbols) and GitHub Packages.'
          else
            FEEDS='Published to GitHub Packages only — NUGET_API_KEY is not configured, so this version is not on NuGet.org and its symbols were not published to a symbol server.'
          fi

          # CS2OpenDev.Protos carries no schema revision — it is versioned on
          # the protobuf clock and stamps its own CS2 build id from
          # protos/PROVENANCE.json. Reporting an empty revision would read as a
          # missing value rather than a deliberately absent one.
          if [ -n "${REVISION:-}" ]; then
            PROVENANCE=$(printf 'CS2 schema revision: `%s` (dump %s).' "$REVISION" "$DUMP_DATE")
          else
            BUILD_ID=$(python3 -c "import json;print(json.load(open('protos/PROVENANCE.json'))['build_id'])")
            PROVENANCE=$(printf 'Protobuf descriptors from CS2 build `%s`. See `protos/PROVENANCE.json`.' "$BUILD_ID")
          fi

          NOTES=$(printf 'Automated release of `%s`.\n\n%s\n\n%s' \
                         "$PKG_ID" "$PROVENANCE" "$FEEDS")

          # Attach both packages so the release page carries the symbols too,
          # not just the assemblies. Built as an array so a missing .snupkg
          # degrades to a nupkg-only release instead of passing an empty
          # argument to `gh`.
          ASSETS=("$PKG_PATH")
          if [ -n "$PKG_SYMBOLS" ]; then
            ASSETS+=("$PKG_SYMBOLS")
          fi

          # Idempotent: `gh release create` hard-fails if the tag already
          # exists, which would break any re-run of this job on the same
          # commit — exactly what happens when NUGET_API_KEY is added later and
          # the release is dispatched again to push the same version to
          # NuGet.org. Update the existing release's assets instead.
          #
          # Only when it really is the same commit. The refresh above was
          # written for a re-run and applied to any re-encounter of the tag,
          # which is not the same thing: a version can repeat on a NEW commit
          # whenever that commit does not advance this package's git height.
          # It happened — CS2OpenDev.Sdk.GameEvents 2.0.4 was tagged at one
          # commit and its release asset later replaced by a build from a
          # later one, whose nuspec named a different CS2OpenDev.Protos. The
          # feed rejected that push as a duplicate (NuGet versions are
          # immutable, correctly), so the release page and the feed then
          # served different artifacts under one version.
          #
          # Refuse rather than pick a side. Two artifacts for one version is a
          # bug wherever it is resolved, and the feed is the copy that cannot
          # be corrected — so the release page must not silently drift from
          # it. A green run that overwrote a published artifact is worse than
          # a red one that explains why.
          # Resolve the tag itself rather than reading `targetCommitish`, which
          # holds whatever was passed at creation and is a branch name ("main")
          # as often as a SHA — comparing that against a commit would fail every
          # legitimate re-run. `git rev-list -n 1` dereferences annotated and
          # lightweight tags alike, and the checkout above is fetch-depth: 0 so
          # the tag is local. Fall back to the API field only if it is not.
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null \
                           || gh release view "$TAG" --json targetCommitish \
                                --jq '.targetCommitish')
          else
            EXISTING_SHA=""
          fi

          # Leave it alone and say so — do not fail. A version repeating on a
          # later commit is the NORMAL case, not an anomaly: pathFilters exist
          # precisely so a commit that does not touch a package leaves its
          # version where it was, and every such push reaches this line. The
          # first version of this guard called that an error and turned every
          # docs-only push into a red release.
          #
          # The invariant worth holding is narrower than "the version must be
          # new": a published artifact must never be replaced. Skipping holds
          # it exactly, and cannot be wrong — if the tree really did change
          # without moving the version, the fix is that package's pathFilters,
          # and nothing was overwritten in the meantime. The feed already
          # behaves this way via `--skip-duplicate`; this makes the release
          # page agree with it instead of drifting.
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
            echo "::notice::${PKG_ID} ${TAG#*/v} was released from ${EXISTING_SHA}; this run built the same version from ${TARGET_SHA}. Leaving the published release untouched. If this package's contents changed in that range, its version.json pathFilters do not cover everything that ships."
            exit 0
          fi

          if [ -n "$EXISTING_SHA" ]; then
            echo "::notice::Release $TAG already exists at the same commit — refreshing its assets and notes."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$TARGET_SHA"
          fi
