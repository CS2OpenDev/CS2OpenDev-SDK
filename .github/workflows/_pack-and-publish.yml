name: Pack and publish

# Reusable workflow that packs the SDK and publishes it to NuGet.org.
# Invoked via `workflow_call` from both check-upstream.yml (scheduled bot
# refresh) and release.yml (manual or version.json-driven release). Keeping
# the pack+publish logic in one place avoids the chained-workflow gotcha
# where the default GITHUB_TOKEN can't trigger downstream workflow_runs.

on:
  workflow_call:
    inputs:
      ref:
        description: Ref/SHA to build (defaults to the caller's ref).
        type: string
        required: false
        default: ''
    secrets:
      NUGET_API_KEY:
        description: NuGet.org publish key. When omitted the package is still built and uploaded as a workflow artifact so forks can download it.
        required: false

permissions:
  contents: write

jobs:
  publish:
    name: Pack and publish to NuGet.org
    runs-on: ubuntu-latest
    env:
      # Job-level so `if: env.NUGET_API_KEY != ''` can read it in step
      # conditions (step-level env is evaluated AFTER step `if:`).
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          # Full history so Nerdbank.GitVersioning can compute git-height.
          fetch-depth: 0

      - name: Capture checked-out SHA
        # `github.sha` reflects the caller's trigger SHA, not necessarily the
        # ref we actually checked out (when invoked from check-upstream.yml,
        # the caller passes a freshly-pushed bot commit via `inputs.ref`).
        # Capture HEAD now so the GitHub Release tags the right commit.
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build (Release)
        run: dotnet build src/CS2OpenDev.Sdk --configuration Release -nologo

      - name: Read CS2 schema metadata
        id: schema
        uses: ./.github/actions/read-schema-metadata

      - name: Pack SDK
        run: |
          dotnet pack src/CS2OpenDev.Sdk \
            --configuration Release \
            -nologo \
            -p:CS2SchemaRevision=${{ steps.schema.outputs.revision }} \
            -p:CS2SchemaDate=${{ steps.schema.outputs.date-iso }}

      - name: Resolve produced packages
        id: pkg
        run: |
          set -euo pipefail
          # The pack step produces both `.nupkg` (assemblies) and `.snupkg`
          # (symbols / portable PDBs) thanks to `IncludeSymbols=true` +
          # `SymbolPackageFormat=snupkg` in the SDK csproj. Resolve the
          # `.nupkg` first — its filename carries the version — then derive
          # the matching `.snupkg` path. Both must exist before publish.
          PKG=$(find artifacts/package -name 'CS2OpenDev.Sdk.*.nupkg' -not -name '*.snupkg' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::No .nupkg produced under artifacts/package/"
            exit 1
          fi
          SYM="${PKG%.nupkg}.snupkg"
          if [ ! -f "$SYM" ]; then
            echo "::warning::Symbols package missing at $SYM — proceeding without symbols"
            SYM=""
          fi
          VERSION=$(basename "$PKG" .nupkg | sed 's/^CS2OpenDev\.Sdk\.//')
          PKG_DIR=$(dirname "$PKG")

          {
            echo "path=$PKG"
            echo "symbols=$SYM"
            echo "dir=$PKG_DIR"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Packed: $PKG ($VERSION)"
          if [ -n "$SYM" ]; then echo "Symbols: $SYM"; fi

      - name: Assert no build-machine paths in packages
        # Guards the leak fixed in v1.0.3: v1.0.2 shipped the packer's home
        # directory in the assembly's CodeView record and in the `.snupkg`
        # PDB's SourceLink map. `ContinuousIntegrationBuild=true` in the SDK
        # csproj rewrites those to `/_/`; this step fails the release if a
        # build ever stops honouring it (e.g. the property gets dropped, or a
        # future runner layout defeats the path mapping).
        #
        # Asserts the positive signal too — a `/_/` path must be PRESENT, not
        # merely a home path absent. Absence alone is equally what you get from
        # scanning the wrong file or a stale artifact.
        #
        # No third-party allowlist needed: both packages contain only
        # first-party output (the assembly, its XML docs, README, and NuGet
        # metadata). Microsoft's and other vendors' binaries legitimately
        # carry their own CI agents' paths, but none are bundled here.
        env:
          PKG: ${{ steps.pkg.outputs.path }}
          SYM: ${{ steps.pkg.outputs.symbols }}
        run: |
          set -euo pipefail
          python3 - "$PKG" ${SYM:+"$SYM"} <<'PY'
          import sys, zipfile

          LEAKS = (b'/Users/', b'/home/', b'/root/', b'C:\\Users\\')
          rc = 0

          for path in sys.argv[1:]:
              print(f'=== {path} ===')
              leaked, normalised = {}, 0
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      data = z.read(name)
                      found = {n.decode('latin1'): data.count(n)
                               for n in LEAKS if data.count(n)}
                      normalised += data.count(b'/_/')
                      if found:
                          leaked[name] = found
                          for n in LEAKS:
                              i = data.find(n)
                              if i >= 0:
                                  print(f'  {name}: {data[i:i + 110]!r}')
              if leaked:
                  print(f'::error::Build-machine path in {path}: '
                        f'{", ".join(leaked)}. Check that '
                        'ContinuousIntegrationBuild=true is still set in '
                        'src/CS2OpenDev.Sdk/CS2OpenDev.Sdk.csproj.')
                  rc = 1
              elif not normalised:
                  print(f'::error::No build-machine path in {path}, but no '
                        'normalised `/_/` path either — the build did not '
                        'pick up ContinuousIntegrationBuild, or this is a '
                        'stale artifact. Treating as unverified.')
                  rc = 1
              else:
                  print(f'  clean ({normalised} normalised `/_/` occurrence(s))')

          sys.exit(rc)
          PY

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.pkg.outputs.version }}
          # Glob captures the .nupkg AND the matching .snupkg so a single
          # downloadable artifact carries both.
          path: ${{ steps.pkg.outputs.dir }}/CS2OpenDev.Sdk.*.*nupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != ''
        # `dotnet nuget push` with a glob picks up both the .nupkg and the
        # adjacent .snupkg in one call — NuGet.org routes the symbols package
        # to its symbol server automatically when paired this way.
        run: |
          dotnet nuget push "${{ steps.pkg.outputs.dir }}/CS2OpenDev.Sdk.*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Notice when publish is skipped
        # Loud notice that the package was built but NOT uploaded to NuGet.org.
        # Catches misconfigured secrets (e.g. `NUGET_TOKEN` vs `NUGET_API_KEY`)
        # that would otherwise silently fail to publish for weeks.
        if: env.NUGET_API_KEY == ''
        run: |
          echo "::warning::NUGET_API_KEY secret is not set on this repository — package built (${{ steps.pkg.outputs.version }}) but NOT published to NuGet.org. Download it from the workflow run's Artifacts section. To enable publishing, add the secret in Settings → Secrets and variables → Actions."

      - name: Create GitHub Release
        if: env.NUGET_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(printf 'Automated release.\n\nCS2 schema revision: `%s` (dump %s).' \
                         "${{ steps.schema.outputs.revision }}" \
                         "${{ steps.schema.outputs.date-iso }}")
          gh release create "v${{ steps.pkg.outputs.version }}" \
            "${{ steps.pkg.outputs.path }}" \
            --title "v${{ steps.pkg.outputs.version }}" \
            --notes "$NOTES" \
            --target ${{ steps.head.outputs.sha }}
