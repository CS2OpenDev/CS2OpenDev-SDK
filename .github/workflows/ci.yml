name: CI

# Gatekeeper workflow on every PR and every push to main. Runs the test suites
# AND two regenerate-and-compare checks: the SDK/GameEvents sources and the
# staged protobuf subset must both match what's committed. That catches "edited
# the generator but forgot to regen" and "bumped the tracker but forgot to
# restage protos" PRs before they merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR / branch — saves CI minutes when a
# contributor pushes a follow-up commit before the previous run finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, verify regen idempotency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so Nerdbank.GitVersioning can compute git-height.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build (warnings-as-errors)
        run: dotnet build --configuration Release -nologo

      - name: Run generator test suite (TUnit via dotnet run)
        # The test projects are exes under TUnit; `dotnet run` is the supported
        # invocation per the project README (dotnet test is unsupported on
        # Microsoft.Testing.Platform-on-net10).
        run: dotnet run --configuration Release --project test/CS2OpenDev.Sdk.Generator.Tests

      - name: Run game-events test suite
        # Exercises the shipped decoder surface against real protobuf messages,
        # rather than the generator that emitted half of it.
        run: dotnet run --configuration Release --project test/CS2OpenDev.Sdk.GameEvents.Tests

      - name: Verify staged protos are current
        # Re-derives the demo/engine subset from the schema-tracker submodule and
        # fails if `protos/` differs. Also compiles the subset in isolation, which
        # is the only way to prove it is import-closed — protoc resolves imports
        # against anything on its include path, so a set that "works" inside the
        # full 40-file directory may not actually be closed.
        run: python3 scripts/normalize-protos.py --check

      - name: Verify the proto and C# surfaces have not shrunk without a version bump
        # `normalize-protos.py --check` above proves protos/ matches the submodule.
        # It says nothing about whether that content is releasable, and those are
        # different questions: 3.0.7 was a faithful restage of an upstream closure
        # prune that removed 188 public types, and shipped as a patch.
        #
        # One invocation, three conditions — schema readiness, the `.proto`
        # surface, and since issue #32 the emitted C# surface of CS2OpenDev.Sdk.
        # They share a step because they share a script and each reports itself by
        # name; splitting them would mean running the schema check three times.
        # The C# half is the one with teeth here: the 5.0 repair changed 1,923
        # property types and dropped 760 stub classes with nothing in the pipeline
        # in a position to say so.
        #
        # This runs on PRs as well as the cron because a removal can arrive either
        # way — a submodule bump, or someone editing the staged set by hand — and
        # only the cron path called the readiness gate before. Needs tags, which
        # the fetch-depth: 0 checkout above provides.
        run: python3 scripts/check-migration-readiness.py

      - name: Verify every package is wired for release
        # Adding a package means editing three files, and getting two right looks
        # exactly like getting all three right. A package missing from
        # release.yml's trigger paths does not error — it merges and silently
        # never ships. That happened to CS2OpenDev.Sdk.Entities.Abstractions.
        #
        # PyYAML is installed rather than assumed. The script degrades to a
        # warning without it, which is right for a local run and wrong here — a
        # gate that quietly does nothing is the failure it exists to prevent.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/check-release-wiring.py

      - name: Self-test the proto surface gate
        # Replays the 3.0.6 -> 3.0.7 incident and its correction out of git, and
        # asserts the gate fires on one and not the other. A gate that silently
        # stopped detecting anything would otherwise look identical to a clean run
        # forever — the failure mode of every check that is never exercised.
        run: python3 scripts/check-migration-readiness.py --selftest proto

      - name: Self-test the SDK surface gate
        # Same argument, one step further. The verdict cases replay 4.1.5 -> 5.0.1
        # twice: once against the version pair that actually shipped, which must
        # pass, and once against a counterfactual unchanged 4.1, which must fail.
        # No released CS2OpenDev.Sdk tag pair removes API unacknowledged, so the
        # counterfactual is the only way to prove the gate fires at all.
        #
        # It also pins the counts — 1,923 property type changes across 820 classes,
        # 760 types removed — against the numbers docs/MIGRATION-5.0.md was built
        # from by a different method. That is the part that matters most: the C#
        # surface is extracted lexically, so an emitter reformat that the compiler
        # would not notice could blind the extractor, and an extractor that sees
        # nothing produces a clean diff and a green verdict forever. Only a case
        # that knows the right number catches that.
        run: python3 scripts/check-migration-readiness.py --selftest sdk

      - name: Regenerate SDK + game-event factories into a clean tree
        run: dotnet run --configuration Release --project src/CS2OpenDev.Sdk.Exporter

      - name: Fail if regen produced a diff
        # If regen output differs from what's committed, someone changed the
        # generator (or the schema) without committing the corresponding
        # regeneration. Both output trees are checked: the SDK proper and the
        # generated half of CS2OpenDev.Sdk.GameEvents.
        #
        # names.lock.json is checked too, and it is not just tidiness. The lock
        # is what stops a word-vocabulary edit from renaming published API, and
        # it only protects a name once that name is IN it. A regen that appends
        # an entry and does not commit it leaves the name unpinned while looking
        # entirely green — the protection silently does not exist for exactly
        # the names most recently added.
        #
        # schema-lens/ rides in the same gate: the exporter rewrites state.json
        # from the migrations plus the current schema, so a diff here means a
        # schema bump (or migration edit) whose Lens consequences were never
        # reviewed. This is also where the CS2_GEN_012 baseline gets its teeth —
        # observedFields only protects a class once the file recording it is
        # committed.
        run: |
          if ! git diff --exit-code -- src/CS2OpenDev.Sdk/ \
                                       src/CS2OpenDev.Sdk.GameEvents/Generated/ \
                                       names.lock.json \
                                       schema-lens/; then
            echo "::error::Regenerated sources differ from what is committed."
            echo "::error::Run \`dotnet run --project src/CS2OpenDev.Sdk.Exporter\` locally and commit the result."
            exit 1
          fi

      - name: Test the schema-metadata action
        # Runs before the action does, because the action's failure mode is a
        # silent wrong answer rather than a red step: it feeds the package
        # version, and `dotnet pack` accepts whatever it is handed. The cases
        # cover both upstream header shapes plus the fail-closed paths.
        run: bash .github/actions/read-schema-metadata/test.sh

      - name: Read CS2 schema metadata
        id: schema
        uses: ./.github/actions/read-schema-metadata

      - name: Verify NuGet pack succeeds
        # Doesn't publish — just validates that pack runs clean end-to-end for
        # every shipped package, with the same build-metadata injection the
        # release workflow uses. We deliberately omit `--no-build`: `dotnet pack`
        # re-runs pack-specific targets that aren't covered by the prior
        # `dotnet build`, and the extra cost is small compared to the
        # reliability win.
        #
        # CS2OpenDev.Protos takes no CS2Schema* properties: it stamps its
        # provenance from the committed `protos/PROVENANCE.json` instead, so a
        # local pack produces a correctly identified package too.
        run: |
          dotnet pack src/CS2OpenDev.Sdk \
            --configuration Release \
            -nologo \
            -p:CS2SchemaRevision=${{ steps.schema.outputs.revision }} \
            -p:CS2SchemaDate=${{ steps.schema.outputs.date-iso }}
          dotnet pack src/CS2OpenDev.Protos --configuration Release -nologo
          dotnet pack src/CS2OpenDev.Sdk.GameEvents \
            --configuration Release \
            -nologo \
            -p:CS2SchemaRevision=${{ steps.schema.outputs.revision }} \
            -p:CS2SchemaDate=${{ steps.schema.outputs.date-iso }}
          # No schema properties: nothing in the abstractions package is generated
          # from a CS2 build, so there is no revision to stamp.
          dotnet pack src/CS2OpenDev.Sdk.Entities.Abstractions --configuration Release -nologo
          dotnet pack src/CS2OpenDev.Sdk.Entities \
            --configuration Release \
            -nologo \
            -p:CS2SchemaRevision=${{ steps.schema.outputs.revision }} \
            -p:CS2SchemaDate=${{ steps.schema.outputs.date-iso }}

      - name: Assert CS2OpenDev.Sdk stays dependency-free
        # A standing constraint, and one that is easy to break by accident: the
        # SDK ships schema types only, and a consumer who wants those must not be
        # made to take Google.Protobuf. That is the entire reason the decoder
        # lives in a separate package. Enforced here rather than trusted, because
        # a stray ProjectReference would otherwise ship silently.
        run: |
          PKG=$(find artifacts/package -name 'CS2OpenDev.Sdk.[0-9]*.nupkg' -not -name '*.snupkg' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::No CS2OpenDev.Sdk .nupkg found to inspect"
            exit 1
          fi
          mkdir -p /tmp/sdk-nuspec && unzip -o -q "$PKG" -d /tmp/sdk-nuspec
          NUSPEC=/tmp/sdk-nuspec/CS2OpenDev.Sdk.nuspec
          if grep -q '<dependency ' "$NUSPEC"; then
            echo "::error::CS2OpenDev.Sdk gained a package dependency:"
            grep '<dependency ' "$NUSPEC"
            echo "::error::Schema types must stay dependency-free. Put anything needing"
            echo "::error::Google.Protobuf in CS2OpenDev.Sdk.GameEvents instead."
            exit 1
          fi
          echo "CS2OpenDev.Sdk has no package dependencies."
