name: Check upstream schema

# Scheduled workflow that pulls the latest commit from BOTH upstream
# submodules, regenerates whatever changed, pushes the result directly to main,
# AND publishes the new packages in the same run.
#
# Two upstreams, two artifacts, two clocks:
#   upstream/       (CS2OpenDev-Docs)         -> schema JSON  -> CS2OpenDev.Sdk
#   schema-tracker/ (CS2OpenDev-SchemaTracker) -> .proto files -> CS2OpenDev.Protos
#
# They move independently: most CS2 patches change the schema without touching
# a single .proto, and a tracker rebuild can land protos with no schema change.
# Refreshing only one would silently freeze the other package.
#
# Why pack+publish here instead of letting release.yml fire on the push:
# pushes from a workflow authenticated with the default GITHUB_TOKEN are
# explicitly blocked from triggering downstream workflows (push, workflow_run
# events don't fire on their own runs). Chaining via a PAT works but adds a
# required secret and rotation burden. Calling the reusable pack-and-publish
# workflow as a dependent job keeps everything in this single workflow run.
#
# Cadence matches the upstream repo's own 4-hour refresh, so we never lag
# Valve's CS2 patches by more than ~4 hours (plus the upstream's own pickup
# delay).

on:
  schedule:
    # Top of every 4-hour block, offset by 15 minutes so we land after the
    # upstream's hourly auto-commits have settled.
    - cron: '15 */4 * * *'
  workflow_dispatch: {}

# Only one scheduled refresh at a time — avoids racing pushes if a manual
# run overlaps the cron.
concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: write
  # The scheduled bot path also calls _pack-and-publish.yml, which pushes to
  # GitHub Packages. Without this the reusable workflow's own `packages: write`
  # is capped away by this caller and the push fails with a 403.
  packages: write

jobs:
  refresh:
    name: Pull upstream, regen, push
    runs-on: ubuntu-latest
    outputs:
      # Surfaced for the dependent publish job so it can skip if there's
      # nothing to publish.
      sdk_changed: ${{ steps.sdk_diff.outputs.sdk_changed }}
      pushed_sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure bot git identity
        run: |
          git config user.name "CS2OpenDev-bot"
          git config user.email "bot@CS2OpenDev.invalid"

      - name: Capture pre-update schema revision
        id: before
        uses: ./.github/actions/read-schema-metadata

      - name: Bump upstream submodules to latest
        id: bump
        run: |
          # `--remote` updates each submodule's checked-out commit to the tip of
          # its tracked branch. We deliberately don't pass `--merge`: submodules
          # in a normal checkout are in detached-HEAD state, so there's no local
          # branch to merge into and the flag behaves unpredictably. `--remote`
          # alone plus `git add` is all we need.
          #
          # schema-tracker tracks its `latest` branch (newest CS2 build only),
          # declared in .gitmodules.
          #
          # That submodule is also declared `shallow = true`, and the two
          # settings fight each other here: actions/checkout honours `shallow`
          # and clones it at the pinned SHA with no remote-tracking refs, but
          # `--remote` resolves `refs/remotes/origin/<branch>` inside the
          # submodule. It isn't there, so the whole step dies with
          #   fatal: Unable to find refs/remotes/origin/latest revision in
          #   submodule path 'schema-tracker'
          # and exit 128 — before the regen that this job actually exists to
          # run. Create the ref explicitly first. `--depth 1` is what keeps the
          # multi-GB artifact history out, which is the point of `shallow`.
          git -C schema-tracker fetch --depth 1 origin \
            latest:refs/remotes/origin/latest

          git submodule update --remote upstream schema-tracker

          if git diff --quiet -- upstream; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- schema-tracker; then
            echo "tracker_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tracker_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- upstream schema-tracker; then
            echo "submodule_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Both upstream submodules are already at latest — nothing to do."
          else
            echo "submodule_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture post-update schema revision
        if: steps.bump.outputs.submodule_changed == 'true'
        id: after
        uses: ./.github/actions/read-schema-metadata

      - name: Set up .NET
        if: steps.bump.outputs.submodule_changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build generator + exporter
        if: steps.bump.outputs.submodule_changed == 'true'
        run: dotnet build --configuration Release -nologo

      - name: Run test suite
        if: steps.bump.outputs.submodule_changed == 'true'
        run: dotnet run --configuration Release --project test/CS2OpenDev.Sdk.Generator.Tests

      - name: Restage protos from the tracker
        # Only when the tracker actually moved. Re-derives the demo/engine
        # subset, re-injects the csharp_namespace option, and rewrites
        # protos/PROVENANCE.json with the new CS2 build id. Also re-verifies the
        # subset compiles in isolation, so a Valve change that breaks the import
        # closure fails here rather than in a consumer's build.
        if: steps.bump.outputs.tracker_changed == 'true'
        run: python3 scripts/normalize-protos.py

      - name: Check the bumped schema is one we can ship
        # This job bumps, regenerates, commits, pushes to main, and triggers a
        # publish — unattended, every four hours. Until 2026-08-09 the thing
        # standing between a breaking upstream change and a stable release was
        # the generator being unable to parse schema 2.0 at all: the regen below
        # failed, so nothing after it ran. That was never a designed gate, and
        # teaching the generator to read 2.0 removed it.
        #
        # So state the condition instead of relying on a parse failure to imply
        # it. Runs before the regen so the log says "not ready to bump" rather
        # than burying it behind a successful regen of output we would not ship.
        if: steps.bump.outputs.submodule_changed == 'true'
        run: python3 scripts/check-migration-readiness.py

      - name: Regenerate SDK + game-event factories
        if: steps.bump.outputs.submodule_changed == 'true'
        run: dotnet run --configuration Release --project src/CS2OpenDev.Sdk.Exporter

      - name: Decide whether any shipped content changed
        # A submodule moved, but the regenerated output might match what's
        # already committed (e.g. upstream re-committed an unrelated overlay
        # change that doesn't affect the projected types, or a tracker rebuild
        # produced byte-identical descriptors). We still commit the submodule
        # bump in that case, but we don't trigger a publish if there's nothing
        # downstream consumers would see.
        #
        # All three shipped trees are checked, because each feeds a different
        # package and any one of them changing is worth a release.
        if: steps.bump.outputs.submodule_changed == 'true'
        id: sdk_diff
        run: |
          if git diff --quiet -- src/CS2OpenDev.Sdk/ src/CS2OpenDev.Sdk.GameEvents/Generated/ protos/; then
            echo "sdk_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sdk_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push
        if: steps.bump.outputs.submodule_changed == 'true'
        id: push
        env:
          BEFORE_REV: ${{ steps.before.outputs.revision }}
          AFTER_REV: ${{ steps.after.outputs.revision }}
          AFTER_DATE: ${{ steps.after.outputs.date-iso }}
          SDK_CHANGED: ${{ steps.sdk_diff.outputs.sdk_changed }}
          DOCS_CHANGED: ${{ steps.bump.outputs.docs_changed }}
          TRACKER_CHANGED: ${{ steps.bump.outputs.tracker_changed }}
        run: |
          set -euo pipefail
          # names.lock.json belongs here even though it is not a shipped tree.
          # A new upstream field is resolved by the word vocabulary and appended
          # to the lock; leaving it uncommitted throws that away, so the name is
          # re-derived on every future run and never actually pinned — which is
          # the one thing the lock exists to do.
          git add upstream schema-tracker src/CS2OpenDev.Sdk/ \
                  src/CS2OpenDev.Sdk.GameEvents/Generated/ protos/ \
                  names.lock.json

          # Subject names whichever upstream actually moved, so the log reads as
          # what happened rather than always as a schema regen.
          if [ "$DOCS_CHANGED" = "true" ] && [ "$BEFORE_REV" != "$AFTER_REV" ]; then
            SUBJECT="chore(schema): regen for CS2 ${BEFORE_REV} → ${AFTER_REV}"
          elif [ "$DOCS_CHANGED" = "true" ] && [ "$TRACKER_CHANGED" = "true" ]; then
            SUBJECT="chore(upstream): refresh schema enrichment and protos"
          elif [ "$TRACKER_CHANGED" = "true" ]; then
            BUILD_ID=$(python3 -c "import json;print(json.load(open('protos/PROVENANCE.json'))['build_id'])")
            SUBJECT="chore(protos): restage for CS2 build ${BUILD_ID}"
          else
            SUBJECT="chore(schema): refresh upstream enrichment (CS2 ${AFTER_REV} unchanged)"
          fi

          BODY=""
          if [ "$DOCS_CHANGED" = "true" ]; then
            BODY="Docs submodule bumped to dump ${AFTER_DATE}."
          fi
          if [ "$TRACKER_CHANGED" = "true" ]; then
            [ -n "$BODY" ] && BODY="${BODY}"$'\n'
            BODY="${BODY}SchemaTracker submodule bumped; protos/ restaged."
          fi
          if [ "$SDK_CHANGED" = "false" ]; then
            BODY="${BODY}"$'\n'"Shipped content unchanged — only submodule pointers moved."
          fi

          git commit -m "$SUBJECT" -m "$BODY"
          git push origin HEAD:main

          # Surface the new SHA so the dependent publish job can target it
          # explicitly (rather than the workflow's `github.sha`, which still
          # points at the pre-bump commit this job was triggered on).
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    # Dependent job — runs only when the refresh produced an SDK content
    # change. Calls the reusable pack-and-publish workflow targeting the SHA
    # we just pushed. Keeping this inside the same workflow run sidesteps the
    # GITHUB_TOKEN chained-workflow restriction.
    needs: refresh
    if: needs.refresh.outputs.sdk_changed == 'true'
    uses: ./.github/workflows/_pack-and-publish.yml
    with:
      ref: ${{ needs.refresh.outputs.pushed_sha }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
