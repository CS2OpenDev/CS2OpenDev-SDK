name: Release

# Pack + publish to NuGet.org on every push to main that changes either the
# generated SDK contents or version.json. Delegates the actual work to the
# reusable `_pack-and-publish.yml` so the same pipeline runs whether release
# is invoked here, from check-upstream.yml, or via manual workflow_dispatch.
#
# Per the versioning policy: every commit touching `src/CS2OpenDev.Sdk/`
# advances the Nerdbank.GitVersioning patch number (`pathFilters` in
# version.json), so every triggered run produces a new monotonic version.
# Build metadata (`+cs.{revision}.dump.{yyyy-MM-dd}`) is injected by the
# reusable workflow from the upstream cs2_schema.json header.

on:
  push:
    branches: [main]
    paths:
      - 'src/CS2OpenDev.Sdk/**'
      - 'version.json'
  workflow_dispatch: {}

# Releases must serialise — never two pushes to NuGet at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_pack-and-publish.yml
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
