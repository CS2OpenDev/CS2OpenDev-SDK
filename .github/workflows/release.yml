name: Release

# Pack + publish to NuGet.org on every push to main that changes either the
# generated SDK contents or version.json. Delegates the actual work to the
# reusable `_pack-and-publish.yml` so the same pipeline runs whether release
# is invoked here, from check-upstream.yml, or via manual workflow_dispatch.
#
# Per the versioning policy: every commit touching a package's `pathFilters`
# advances that package's Nerdbank.GitVersioning patch number, so every
# triggered run produces a new monotonic version for whichever packages moved.
# The reusable workflow packs all three and `--skip-duplicate` makes the
# unchanged ones no-ops on the feed, so this does not need to work out which
# package a given push affected.
#
# The trigger paths must cover all three packages. `src/CS2OpenDev.Sdk/**` is a
# literal prefix match and does NOT match `src/CS2OpenDev.Sdk.GameEvents/**`,
# so each is listed explicitly — as is `protos/`, which is the input
# CS2OpenDev.Protos is built from and the only thing that moves its version.

on:
  push:
    branches: [main]
    paths:
      - 'src/CS2OpenDev.Sdk/**'
      - 'src/CS2OpenDev.Sdk.GameEvents/**'
      - 'src/CS2OpenDev.Protos/**'
      - 'protos/**'
      # In CS2OpenDev.Protos' version.json pathFilters, so editing it moves that
      # package's version. Without it here the bump happens and nothing ships
      # until some later push drags it out.
      - 'scripts/normalize-protos.py'
      # Root version.json only — the per-package ones are already covered by
      # their `src/<id>/**` globs above.
      - 'version.json'
  workflow_dispatch: {}

# Releases must serialise — never two pushes to NuGet at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Passed through to _pack-and-publish.yml for the GitHub Packages push.
  # A reusable workflow cannot elevate beyond what its caller grants.
  packages: write

jobs:
  release:
    uses: ./.github/workflows/_pack-and-publish.yml
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
