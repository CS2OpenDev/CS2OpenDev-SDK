name: Release

# Pack + publish to NuGet.org on every push to main that changes either the
# generated SDK contents or version.json. Delegates the actual work to the
# reusable `_pack-and-publish.yml` so the same pipeline runs whether release
# is invoked here, from check-upstream.yml, or via manual workflow_dispatch.
#
# Per the versioning policy: every commit touching a package's `pathFilters`
# advances that package's Nerdbank.GitVersioning patch number, so every
# triggered run produces a new monotonic version for whichever packages moved.
# The reusable workflow packs all three and `--skip-duplicate` makes the
# unchanged ones no-ops on the feed, so this does not need to work out which
# package a given push affected.
#
# The trigger paths must cover all five packages. `src/CS2OpenDev.Sdk/**` is a
# literal prefix match and does not match `src/CS2OpenDev.Sdk.GameEvents/**`,
# so each is listed explicitly — as is `protos/`, which is the input
# CS2OpenDev.Protos is built from and the only thing that moves its version.
#
# That warning caught a real omission the day it was tested: CS2OpenDev.Sdk.-
# Entities.Abstractions was added to the release matrix and both pack paths but
# not here, so it merged to main and no release fired. The failure is silent by
# construction — a package missing from this list does not error, it simply
# never ships, and the matrix that would have built it never runs. Adding a
# package means editing this list, _pack-and-publish.yml's matrix, and ci.yml's
# pack step; miss this one and the other two look complete.

on:
  push:
    branches: [main]
    paths:
      - 'src/CS2OpenDev.Sdk/**'
      - 'src/CS2OpenDev.Sdk.GameEvents/**'
      - 'src/CS2OpenDev.Sdk.Entities/**'
      - 'src/CS2OpenDev.Sdk.Entities.Abstractions/**'
      - 'src/CS2OpenDev.Protos/**'
      - 'protos/**'
      # In CS2OpenDev.Protos' version.json pathFilters, so editing it moves that
      # package's version. Without it here the bump happens and nothing ships
      # until some later push drags it out.
      - 'scripts/normalize-protos.py'
      # A generation input like the script above. In practice a lock change
      # arrives alongside the regenerated tree that caused it, so this rarely
      # fires alone — but a lock-only commit means someone re-baselined names,
      # which is precisely the change that must not reach a feed unnoticed.
      - 'names.lock.json'
      # Root version.json only — the per-package ones are already covered by
      # their `src/<id>/**` globs above.
      - 'version.json'
  workflow_dispatch: {}

# Releases must serialise — never two pushes to NuGet at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Passed through to _pack-and-publish.yml for the GitHub Packages push.
  # A reusable workflow cannot elevate beyond what its caller grants.
  packages: write
  # Passed through for the NuGet.org Trusted Publishing login. Deliberately
  # granted here and not in check-upstream.yml: this is what confines
  # NuGet.org publishing to the release path.
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/_pack-and-publish.yml
    with:
      # NuGet.org via Trusted Publishing (OIDC). The policy on NuGet.org is
      # registered against this repository and this workflow file, under the
      # account named by the NUGET_USER repository variable.
      nuget-org: true
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
